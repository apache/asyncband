[package]
name = "tests-integration"
publish = false

edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
asyncband = { workspace = true, features = [
  "barrier",
  "blocking",
  "broadcast",
  "condvar",
  "latch",
  "lazy-lock",
  "mpsc",
  "mutex",
  "once",
  "once-cell",
  "once-map",
  "oneshot",
  "rwlock",
  "semaphore",
  "shutdown",
  "singleflight",
  "waitgroup",
] }
pollster = { workspace = true, features = ["macro"] }
tokio-test = { workspace = true }

[lib]
bench = false
doc = false
doctest = false
test = false

[lints]
workspace = true
