name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Concurrency strategy:
#   github.workflow: distinguish this workflow from others
#   github.event_name: distinguish `push` event from `pull_request` event
#   github.event.number: set to the number of the pull request if `pull_request` event
#   github.run_id: otherwise, it's a `push` event, only cancel if we rerun the workflow
#
# Reference:
#   https://docs.github.com/en/actions/using-jobs/using-concurrency
#   https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,taplo-cli,hawkeye
      - run: cargo x lint

  test:
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-14, windows-2022 ]
        rust-version: [ "1.85.0", "stable" ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Delete rust-toolchain.toml
        run: rm rust-toolchain.toml
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
      - name: Run unit tests
        run: cargo x test --no-capture
        shell: bash

  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/benchmark
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - name: Check out benchmark baseline
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          path: benchmark-baseline
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare benchmark output
        run: |
          mkdir -p benchmark-results
          : > benchmark-results/baseline.txt
        shell: bash
      - name: Run baseline benchmarks
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if grep -q 'name = "primitives"' benchmark-baseline/mea/Cargo.toml; then
            (
              cd benchmark-baseline
              cargo x bench -- --color never --min-time 1
            ) | tee benchmark-results/baseline.txt
          fi
        shell: bash
      - name: Run candidate benchmarks
        run: cargo x bench -- --color never --min-time 1 | tee benchmark-results/candidate.txt
        shell: bash
      - name: Generate benchmark report
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo x bench-report \
            --baseline benchmark-results/baseline.txt \
            --candidate benchmark-results/candidate.txt \
            --output benchmark-results/report.md
          cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Upload benchmark report
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: benchmark-results/report.md
          retention-days: 7

  benchmark-report:
    name: Report benchmark diff
    if: ${{ github.event_name == 'pull_request' && needs.benchmark.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-report
          path: benchmark-results
      - name: Update pull request report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- mea-benchmark-report -->';
            const report = fs.readFileSync('benchmark-results/report.md', 'utf8');
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.body?.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - benchmark
      - check
      - test
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.benchmark.result }}" == "success" \
              && "${{ needs.check.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit -1
          fi
