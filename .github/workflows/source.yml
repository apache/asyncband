name: Source candidate

on:
  pull_request:
    paths:
      - .github/workflows/source.yml
      - asyncband/Cargo.toml
      - .gitattributes
      - .agents/skills/release/**
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the Infra-managed key (requires ASF Security approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Prepare source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Package committed source
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD --
          revision="$(git rev-parse --verify 'HEAD^{commit}')"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' asyncband/Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_dir="apache-asyncband-${version}-incubating-src"
          mkdir "$RUNNER_TEMP/source"
          git -c tar.umask=0022 archive --format=tar.gz -9 \
            --prefix="${source_dir}/" \
            --output="$RUNNER_TEMP/source/${source_dir}.tar.gz" "$revision"
          cd "$RUNNER_TEMP/source"
          shasum -a 512 "${source_dir}.tar.gz" > "${source_dir}.tar.gz.sha512"
          {
            printf 'Commit: %s\nVersion: %s\n' "$revision" "$version"
            git --version
            cat "${source_dir}.tar.gz.sha512"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sign and verify
        id: sign
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.sign &&
          github.repository == 'apache/asyncband' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: ${{ runner.temp }}/source
        env:
          SIGNING_KEY: ${{ secrets.GPG_SECRET_KEY }}
          SIGNING_FINGERPRINT: ${{ vars.SOURCE_SIGNING_FINGERPRINT }}
          GNUPGHOME: ${{ runner.temp }}/source-gnupg
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          [[ "$SIGNING_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]
          shopt -s nullglob
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          [[ "$archive" =~ ^apache-asyncband-[0-9]+\.[0-9]+\.[0-9]+-incubating-src\.tar\.gz$ ]]

          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$SIGNING_FINGERPRINT"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --local-user "$SIGNING_FINGERPRINT!" --armor --detach-sign "$archive"
          gpg --batch --verify "$archive.asc" "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.sign.outcome == 'success' && 'signed-source' || 'unsigned-source' }}
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
