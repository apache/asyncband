name: Compose source release

on:
  push:
    tags: [ "v*.*.*-rc.*" ]
  pull_request:
    paths:
      - .github/workflows/release-compose.yml
      - .asf.yaml
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
      - '**/*.rs'
      - LICENSE
      - xtask/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LC_ALL: C
  RUSTUP_TOOLCHAIN: "1.95.0"

concurrency:
  group: source-release-${{ github.event_name == 'pull_request' && github.event.number || 'compose' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Compose source release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      archive: ${{ steps.source.outputs.archive }}
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install SBOM tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-cyclonedx@0.5.9,cyclonedx@0.33.1
      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --no-self-update
      - id: source
        name: Archive the release candidate
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "asyncband") | .version')"
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]; then
              echo "::error::Expected an RC tag named vX.Y.Z-rc.N with a positive RC number."
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if [[ "${version}" != "${package_version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
              exit 1
            fi
            test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${commit}"
            git merge-base --is-ancestor "${commit}" origin/main
          else
            version="${package_version}"
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The package must have a stable X.Y.Z version."
            exit 1
          fi
          source="apache-asyncband-${version}-incubating-src"
          mkdir "${RUNNER_TEMP}/source"
          git -c core.attributesFile=/dev/null -c tar.umask=0022 archive \
            --format=tar --prefix="${source}/" "${commit}" \
            | gzip -n -9 > "${RUNNER_TEMP}/source/${source}.tar.gz"
          cd "${RUNNER_TEMP}/source"
          shasum -a 512 "${source}.tar.gz" > "${source}.tar.gz.sha512"
          {
            echo "commit=${commit}"
            echo "version=${version}"
            echo "archive=${source}.tar.gz"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "Source ref: ${GITHUB_REF}"
            echo "Source commit: ${commit}"
            echo
            cat "${source}.tar.gz.sha512"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Generate and validate the library dependency SBOM
        env:
          ARCHIVE: ${{ steps.source.outputs.archive }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${SOURCE_COMMIT}")"
          export SOURCE_DATE_EPOCH
          for attempt in 1 2; do
            source_dir="${RUNNER_TEMP}/sbom-source-${attempt}"
            mkdir "${source_dir}"
            tar -xzf "${RUNNER_TEMP}/source/${ARCHIVE}" --strip-components=1 -C "${source_dir}"
            cargo x sbom --source "${source_dir}" --revision "${SOURCE_COMMIT}" \
              --output "${RUNNER_TEMP}/sbom-${attempt}.cdx.json"
          done
          cmp "${RUNNER_TEMP}/sbom-1.cdx.json" "${RUNNER_TEMP}/sbom-2.cdx.json"
          mv "${RUNNER_TEMP}/sbom-1.cdx.json" "${RUNNER_TEMP}/source/${ARCHIVE}.cdx.json"
          cyclonedx validate --input-version v1_5 --fail-on-errors \
            --input-file "${RUNNER_TEMP}/source/${ARCHIVE}.cdx.json"
          # Cross-check the package set independently of cargo-cyclonedx.
          cargo tree --manifest-path "${source_dir}/asyncband/Cargo.toml" --locked \
            --package asyncband --edges normal,build --all-features \
            --target all --prefix none --format '{p}' \
            | awk '{ print $1 "@" substr($2, 2) }' | sort -u > "${RUNNER_TEMP}/expected-packages"
          jq -r '(.metadata.component, .components[]) | .name + "@" + .version' \
            "${RUNNER_TEMP}/source/${ARCHIVE}.cdx.json" | sort -u > "${RUNNER_TEMP}/sbom-packages"
          cmp "${RUNNER_TEMP}/expected-packages" "${RUNNER_TEMP}/sbom-packages"
          cd "${RUNNER_TEMP}/source"
          shasum -a 512 "${ARCHIVE}.cdx.json" > "${ARCHIVE}.cdx.json.sha512"
          cat "${ARCHIVE}.cdx.json.sha512" >> "${GITHUB_STEP_SUMMARY}"
      - id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source/
          if-no-files-found: error
          compression-level: 0

  sign-and-upload:
    name: Sign and upload source release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'apache/asyncband' }}
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Release approval gates signing with the ASF-provisioned secrets and ATR upload.
    environment:
      name: release
      url: https://releases.apache.org/projects/asyncband
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compose.outputs.artifact-id }}
          path: ${{ runner.temp }}/source
          merge-multiple: true
      - id: gpg
        name: Import the ASF project key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_SECRET_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Sign with the ASF project key
        env:
          ARCHIVE: ${{ needs.compose.outputs.archive }}
          IMPORTED_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          SIGNING_FINGERPRINT: ${{ secrets.SOURCE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "${SIGNING_FINGERPRINT}" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ ]]; then
            echo "::error::The SOURCE_SIGNING_FINGERPRINT secret must be the full uppercase primary fingerprint."
            exit 1
          fi
          if [[ "${IMPORTED_FINGERPRINT}" != "${SIGNING_FINGERPRINT}" ]]; then
            echo "::error::The imported key does not match SOURCE_SIGNING_FINGERPRINT."
            exit 1
          fi
          cd "${RUNNER_TEMP}/source"
          for artifact in "${ARCHIVE}" "${ARCHIVE}.cdx.json"; do
            shasum -a 512 --check "${artifact}.sha512"
            gpg --batch --armor --detach-sign --local-user "${SIGNING_FINGERPRINT}" "${artifact}"
            gpg --batch --status-fd 1 --verify "${artifact}.asc" "${artifact}" \
              | awk -v fingerprint="${SIGNING_FINGERPRINT}" \
                '$2 == "VALIDSIG" && ($3 == fingerprint || $NF == fingerprint) { valid = 1 } END { exit !valid }'
          done
      - name: Upload to ATR compose
        uses: apache/tooling-actions/upload-to-atr@fa721a0b176d713807b574da721b96545b587eea
        with:
          project: asyncband
          version: ${{ needs.compose.outputs.version }}
          src: ${{ runner.temp }}/source
      - name: Record the candidate handoff
        env:
          SOURCE_COMMIT: ${{ needs.compose.outputs.commit }}
          VERSION: ${{ needs.compose.outputs.version }}
          ARCHIVE: ${{ needs.compose.outputs.archive }}
        run: |
          {
            echo "Uploaded RC tag ${GITHUB_REF_NAME} (${SOURCE_COMMIT}) to ATR project asyncband, version ${VERSION}."
            echo
            cat "${RUNNER_TEMP}/source/${ARCHIVE}.sha512"
            cat "${RUNNER_TEMP}/source/${ARCHIVE}.cdx.json.sha512"
            echo
            echo "Inspect ATR checks and record the candidate URL and revision before starting a vote."
            echo "Inspect ATR before rerunning this job after an upload failure; it reuses the source archive and signs it again."
          } >> "${GITHUB_STEP_SUMMARY}"
