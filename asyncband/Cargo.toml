[package]
name = "asyncband"
version = "0.6.7"

categories = ["asynchronous", "concurrency"]
description = "A runtime-agnostic library providing essential synchronization primitives for asynchronous Rust programming."
documentation = "https://docs.rs/asyncband"
keywords = ["async", "concurrency", "synchronization", "waitgroup", "mutex"]

edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

barrier = []
blocking = []
broadcast = []
condvar = ["mutex"]
latch = []
lazy-lock = ["mutex", "once-cell"]
mpsc = []
mutex = []
once = ["semaphore"]
once-cell = ["semaphore"]
once-map = ["dep:hashbrown", "once-cell"]
oneshot = []
rwlock = []
semaphore = []
shutdown = ["latch", "waitgroup"]
singleflight = ["dep:hashbrown", "once-cell"]
waitgroup = []

[dependencies]
hashbrown = { workspace = true, default-features = false, features = [
  "inline-more",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
