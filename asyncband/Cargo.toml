[package]
name = "asyncband"
version = "0.6.7"

categories = ["asynchronous", "concurrency"]
description = "A runtime-agnostic library providing essential synchronization primitives for asynchronous Rust programming."
documentation = "https://docs.rs/asyncband"
keywords = ["async", "concurrency", "synchronization", "waitgroup", "mutex"]

edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

# Each primitive has its own feature, so users can opt in to only what they need.
admission = []
atomicbox = []
barrier = []
broadcast = []
condvar = ["mutex"]
latch = []
mpsc = ["atomicbox"]
mutex = []
once = ["dep:hashbrown", "semaphore"]
oneshot = []
rwlock = []
semaphore = []
shutdown = ["latch", "waitgroup"]
singleflight = ["once"]
waitgroup = []

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = [
  "inline-more",
], optional = true }

[dev-dependencies]
divan = { version = "0.1.21" }
pollster = { version = "1.0.1", features = ["macro"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-test = { version = "0.4.5" }

[[bench]]
harness = false
name = "primitives"
path = "benches/primitives/main.rs"
required-features = [
  "admission",
  "atomicbox",
  "barrier",
  "broadcast",
  "condvar",
  "latch",
  "mpsc",
  "mutex",
  "once",
  "oneshot",
  "rwlock",
  "semaphore",
  "shutdown",
  "singleflight",
  "waitgroup",
]

[lints]
workspace = true
