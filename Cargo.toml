[workspace]
members = [
  "asyncband",
  "benchmarks",
  "examples",
  "tests-integration",
  "tests-integration-macros",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://asyncband.apache.org"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/apache/asyncband"
rust-version = "1.86.0"

[workspace.dependencies]
# Workspace dependencies
asyncband = { path = "asyncband" }

# Optional runtime dependencies
hashbrown = { version = "0.17.1", default-features = false }

# Dev dependencies
async-broadcast = { version = "0.7.2" }
async-channel = { version = "2.5.0" }
cargo_metadata = { version = "0.23.1" }
clap = { version = "4.6.5" }
# Compio 0.17+ uses Rust features newer than the workspace MSRV.
compio = { version = "0.16.1", default-features = false, features = [
  "dispatcher",
  "runtime",
  "time",
] }
divan = { version = "0.1.21" }
flume = { version = "0.12.0", default-features = false }
futures-lite = { version = "2.6.1" }
pollster = { version = "1.0.1" }
semver = { version = "1.0.28" }
serde = { version = "1.0.229" }
smol = { version = "2.0.2" }
tokio = { version = "1.53.1" }
tokio-test = { version = "0.4.5" }
ureq = { version = "3.3.0", default-features = false }
which = { version = "8.0.5" }

[workspace.lints.rust]
unknown_lints = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
module_inception = "allow"
