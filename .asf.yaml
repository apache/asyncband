project:
  metadata:
    key: asyncband
    committee: asyncband
    name: Apache Asyncband
    homepage: https://asyncband.apache.org
    download_page: https://asyncband.apache.org/downloads/
    repositories:
      - https://github.com/apache/asyncband.git
    programming_languages:
      - Rust
  policy:
    github_repository_name: asyncband
    github_compose_workflow_path:
      - .github/workflows/release-compose.yml
    source_artifact_paths:
      - "apache-asyncband-*-incubating-src.tar.gz"
    vote_mode: email
    min_hours: 72
    vote_recipients:
      to: dev@asyncband.apache.org
    # Vote email templates. See https://releases.apache.org/docs/project-configuration#vote.
    # ATR lists the variables each template accepts next to the field in the project settings,
    # and in https://github.com/apache/tooling-trusted-releases/blob/13289acf/atr/construct.py.
    start_vote_subject: "[VOTE] Release Apache Asyncband (Incubating) {{VERSION}}"
    start_vote_template: |
      Hello everyone,

      I would like to call a vote on releasing Apache Asyncband (Incubating)
      {{VERSION}}, staged on ATR as revision {{REVISION}}.

      The release candidate is based on commit:
      {{COMMIT}}

      Source artifacts and ATR checks:
      {{REVIEW_URL}}

      File manifest with checksums:
      {{MANIFEST_URL}}

      Changelog:
      https://github.com/apache/asyncband/blob/{{COMMIT}}/CHANGELOG.md

      KEYS:
      {{KEYS_FILE}}

      The source archive is built by a GitHub Actions workflow and signed
      with the project's automated release signing key:
      023A 42E7 299A 010F EE7A E021 393A FB9D 52BB 37B8
      {{FIRST_ROUND_THREAD}}
      Please vote:

      [ ] +1 Approve the release
      [ ] +0 No opinion
      [ ] -1 Do not approve the release, with a reason

      You can vote on ATR at the candidate page above, or by replying to
      this email. The vote is open for at least {{DURATION}} hours.

      Best regards,
      {{YOUR_FULL_NAME}} ({{YOUR_ASF_ID}})
    announce_recipients:
      to: dev@asyncband.apache.org
      cc:
        - announce@apache.org
    # Announcement email templates. See https://releases.apache.org/docs/project-configuration#finish.
    announce_release_subject: "[ANNOUNCE] Apache Asyncband (Incubating) {{VERSION}} released"
    announce_release_template: |
      The Apache Asyncband (Incubating) project team is pleased to announce
      the release of Apache Asyncband (Incubating) {{VERSION}}.

      Apache Asyncband provides composable, runtime-agnostic concurrency
      building blocks for async Rust.

      The release is available from the download page:

      {{DOWNLOAD_PAGE}}

      The source release, signatures, and checksums are also available at:

      {{DOWNLOAD_URL}}

      The changes in this release are listed in the changelog:

      https://github.com/apache/asyncband/blob/v{{VERSION}}/CHANGELOG.md

      DISCLAIMER: Apache Asyncband (Incubating) is an effort undergoing
      incubation at The Apache Software Foundation (ASF), sponsored by the
      Apache Incubator. Incubation is required of all newly accepted projects
      until a further review indicates that the infrastructure,
      communications, and decision making process have stabilized in a
      manner consistent with other successful ASF projects. While incubation
      status is not necessarily a reflection of the completeness or stability
      of the code, it does indicate that the project has yet to be fully
      endorsed by the ASF.

      On behalf of the Apache Asyncband (Incubating) project team,

      {{YOUR_FULL_NAME}} ({{YOUR_ASF_ID}})
    download_path_suffix: "{{VERSION}}"
  features:
    atr_sync: true

github:
  description: >-
    This crate provides concurrency control and async coordination primitives that are runtime agnostic.
  homepage: https://asyncband.apache.org
  labels:
    - asynchronous
    - futures
    - rust
    - semaphore
    - waitgroup
  enabled_merge_buttons:
    squash: true
    squash_commit_message: PR_TITLE_AND_COMMIT_DETAILS
    merge: false
    rebase: false
  features:
    wiki: false
    issues: true
    projects: false
    discussions: true
  custom_subjects:
    new_discussion: "{title}"
    edit_discussion: "Re: {title}"
    close_discussion: "Re: {title}"
    close_discussion_with_comment: "Re: {title}"
    reopen_discussion: "Re: {title}"
    new_comment_discussion: "Re: {title}"
    edit_comment_discussion: "Re: {title}"
    delete_comment_discussion: "Re: {title}"
  pull_requests:
    allow_auto_merge: true
    allow_update_branch: true
    del_branch_on_merge: true
  environments:
    release:
      required_reviewers:
        - id: jbonofre
          type: User
        - id: Xuanwo
          type: User
        - id: tisonkun
          type: User
        - id: PragmaTwice
          type: User
        - id: orthur2
          type: User
      wait_timer: 0
      prevent_self_review: false
      deployment_branch_policy:
        protected_branches: false
        policies:
          - name: "v*.*.*"
            type: tag
  rulesets:
    - name: ci
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
        excludes: []
      restrict_deletion: true
      restrict_force_push: true
      required_pull_request_reviews:
        dismiss_stale_reviews: false
        require_last_push_approval: false
        require_code_owner_reviews: false
        required_approving_review_count: 0
      required_status_checks:
        - name: Required
          app_slug: github-actions
      required_status_checks_strict: false
    - name: release-tags
      type: tag
      branches:
        includes:
          - "v*.*.*"
        excludes: []
      restrict_deletion: true
      restrict_force_push: true

notifications:
  commits: commits@asyncband.apache.org
  issues: commits@asyncband.apache.org
  pullrequests: commits@asyncband.apache.org
  discussions: dev@asyncband.apache.org
